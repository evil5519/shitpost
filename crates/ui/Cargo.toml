[package]
name = "ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[dependencies]
core = { path = "../core", package = "core", version = "0.1.0" }
calculator-engine = { path = "../calculator-engine", version = "0.1.0" }
egui = "0.36.0"
eframe = { version = "0.36.0", features = ["persistence"] }
serde = { version = "1.0.219", features = ["derive"] }
log = "0.4.27"

[dev-dependencies]
ron = "0.11"

[features]
inspection = ["eframe/inspection"]

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.70"

